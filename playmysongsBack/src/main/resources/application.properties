spring.application.name=PlayMySongs
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=playmysongs_collection

# Tamanho maximo de upload (mp3/ogg podem passar de 1MB, que e o padrao)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
